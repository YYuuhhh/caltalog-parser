name: guhring-parser

x-tools: &tools
  image: guhring-parser-tools:3
  build:
    context: ./scripts
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  volumes:
    - ./catalogs:/catalogs
    - ${GUHRING_CATALOG_DIR:-./catalogs/imports/guhring}:/catalogs/imports/guhring:ro
    - ./parsed:/parsed
    - ./logs:/logs
    - ./scripts:/scripts:ro
    - ./tests:/tests:ro
    - ./mineru:/mineru-src:ro
    - ./schemas:/schemas:ro
    - ./mappings:/mappings:ro
  networks: [parser-internal, parser-edge]

services:
  local-llm:
    container_name: CatalogFlow_local-llm
    image: ollama/ollama:${OLLAMA_VERSION:-0.32.5}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ${OLLAMA_DATA_DIR:-./data/ollama}:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    networks: [parser-internal, parser-edge]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mineru:
    container_name: CatalogFlow_mineru
    image: guhring-parser-mineru-cpu:${MINERU_VERSION:-3.4.5}
    build:
      context: ./mineru
      args:
        MINERU_VERSION: ${MINERU_VERSION:-3.4.5}
        MINERU_TARGET: cpu
        MINERU_MODEL_SOURCE: ${MINERU_MODEL_SOURCE:-huggingface}
    environment:
      MINERU_MODEL_SOURCE: local
      MINERU_MODEL_REVISION: mineru-3.4.5-pipeline
      MINERU_API_OUTPUT_ROOT: /parsed/_api_tasks
      MINERU_API_TASK_RETENTION_SECONDS: ${MINERU_API_TASK_RETENTION_SECONDS:-3600}
      MINERU_API_MAX_CONCURRENT_REQUESTS: "1"
      MINERU_TABLE_MERGE_ENABLE: "0"
      MINERU_CACHE_SCHEMA: v1
      MINERU_UPSTREAM_TIMEOUT: ${MINERU_UPSTREAM_TIMEOUT:-7200}
      PARSED_ROOT: /parsed
      MINERU_DEVICE_MODE: cpu
      MINERU_BACKEND: pipeline
      MINERU_SERVICE: api
      TZ: ${TZ:-Asia/Yekaterinburg}
    volumes:
      - ${GUHRING_CATALOG_DIR:-./catalogs/imports/guhring}:/catalogs/imports/guhring:ro
      - ./catalogs:/catalogs:ro
      - ./parsed:/parsed
      - ./logs:/logs
      - ./scripts:/scripts:ro
      - ./tests:/tests:ro
    ports:
      - "127.0.0.1:${MINERU_API_PORT:-8000}:8000"
    shm_size: ${MINERU_SHM_SIZE:-4gb}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [parser-internal, parser-edge]
    restart: unless-stopped

  pipeline-ui:
    container_name: CatalogFlow_pipeline-ui
    <<: *tools
    depends_on:
      local-llm:
        condition: service_healthy
    entrypoint: ["python", "/scripts/pipeline_ui.py"]
    environment:
      MINERU_API_URL: http://mineru:8000
      PIPELINE_UI_MAX_UPLOAD_MB: ${PIPELINE_UI_MAX_UPLOAD_MB:-512}
      TZ: ${TZ:-Asia/Yekaterinburg}
    volumes:
      - ${GUHRING_CATALOG_DIR:-./catalogs/imports/guhring}:/catalogs/imports/guhring:ro
      - ./catalogs:/catalogs
      - ./parsed:/parsed
      - ./logs:/logs
      - ./scripts:/scripts:ro
      - ./schemas:/schemas:ro
      - ./mappings:/mappings:ro
      - ./ui:/ui:ro
    ports:
      - "127.0.0.1:${PIPELINE_UI_PORT:-7861}:7861"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7861/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tools:
    container_name: CatalogFlow_tools
    <<: *tools
    profiles: [tools]
    environment:
      MINERU_API_URL: http://mineru:8000
      MINERU_BACKEND: pipeline
    restart: "no"

  catalog-etl:
    container_name: CatalogFlow_catalog-etl
    <<: *tools
    profiles: [etl]
    entrypoint: ["python", "/scripts/catalog_etl.py"]
    volumes:
      - ./parsed:/inputs:ro
      - ./parsed/etl:/outputs
      - ./logs/etl:/etl-logs
      - ./schemas:/config/schemas:ro
      - ./mappings:/config/mappings:ro
      - ${GUHRING_CATALOG_DIR:-./catalogs/imports/guhring}:/catalogs/imports/guhring:ro
      - ./catalogs:/catalogs:ro
      - ./scripts:/scripts:ro
    restart: "no"

networks:
  parser-internal:
    driver: bridge
    internal: true
  parser-edge:
    driver: bridge
