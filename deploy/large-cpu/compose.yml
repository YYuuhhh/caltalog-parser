name: catalog-large-cpu

services:
  local-llm:
    container_name: CatalogFlow_large-cpu
    image: catalogflow-large-cpu:0.32.5
    platform: linux/amd64
    build:
      context: .
      args:
        OLLAMA_VERSION: 0.32.5
    # Explicit runc also excludes a host's default NVIDIA runtime.
    runtime: runc
    init: true
    environment:
      OLLAMA_KEEP_ALIVE: ${MODEL_KEEP_ALIVE:-60s}
      OLLAMA_LOAD_TIMEOUT: ${OLLAMA_LOAD_TIMEOUT:-2h}
    volumes:
      - ${MODEL_STORAGE_DIR:-./models}:/models
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-11434}:11434"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test: [CMD, /bin/ollama, list]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
